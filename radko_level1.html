<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Юнакът Радко и Вълшебната корона</title>
<style>
  /* ============================================================
     STORYBOOK THEME
     Warm folk-tale palette, rounded forms, equal-weight choice
     cards (correct and wrong look identical, per the design).
     System fonts only — no external font CDN (Canva Code safe).
     ============================================================ */
  :root{
    --parchment:#f6ecd4; --parchment-2:#efe0bf;
    --ink:#3a2a18; --ink-soft:#6b513a;
    --forest:#2f6b4f; --river:#3b7ea1; --gold:#d8a435;
    --gold-deep:#b9852a; --rose:#b23a2e; --night:#243042;
    --card:#fffaf0; --card-edge:#e6d3a8;
    --shadow:0 10px 24px rgba(58,42,24,.22);
    --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --ui:"Segoe UI Rounded","SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--ui); color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #fff7e6 0%, transparent 60%),
      repeating-linear-gradient(45deg,#f1e3c4 0 22px,#efe0bf 22px 44px);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #app{
    position:relative; width:100%; max-width:760px; height:100%;
    max-height:560px; aspect-ratio:760/560;
    margin:auto; border-radius:26px; overflow:hidden;
    box-shadow:var(--shadow);
    border:6px solid #fff8ec; outline:3px solid var(--card-edge);
    background:var(--parchment);
  }
  @media (max-height:600px){ #app{max-height:100%;border-radius:0} }

  /* ---- scene scaffold ---- */
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;
    opacity:0;transform:scale(1.02);pointer-events:none;
    transition:opacity .45s ease, transform .45s ease;}
  .scene.active{opacity:1;transform:scale(1);pointer-events:auto;}
  .stage{position:relative;flex:1;overflow:hidden;}
  .stage .scenery{position:absolute;inset:0;}
  .scenery svg{width:100%;height:100%;display:block;}

  /* per-scene atmospheres */
  .bg-dawn   {background:linear-gradient(#ffe3a8,#ffd089 45%,#9fcf8f);}
  .bg-forest {background:linear-gradient(#bfe3ef,#8ec9a0 55%,#3f7d52);}
  .bg-river  {background:linear-gradient(#b9e0ef,#6fb6c9 50%,#2f6b7e);}
  .bg-bushes {background:linear-gradient(#cfe6c0,#86b878 55%,#3f6b3a);}
  .bg-vista  {background:linear-gradient(#c7e7f2,#9fd0b6 50%,#5e8f6e);}
  .bg-gate   {background:linear-gradient(#d8c6e0,#9c89ab 55%,#5b4c69);}
  .bg-throne {background:linear-gradient(#f4dca0,#e0b86a 50%,#9c6f37);}
  .bg-win    {background:linear-gradient(#fff0bf,#ffd76b 45%,#e8a13a);}

  /* hero + path progress */
  .pathstrip{position:absolute;left:0;right:0;bottom:10px;height:46px;
    display:flex;align-items:center;justify-content:center;gap:10px;}
  .foot{width:14px;height:14px;border-radius:50%;
    background:rgba(58,42,24,.18);transition:.4s;}
  .foot.done{background:var(--gold);box-shadow:0 0 0 3px rgba(216,164,53,.3);}
  .hero{position:absolute;bottom:42px;width:118px;height:118px;
    transition:left .6s cubic-bezier(.5,1.4,.4,1);filter:drop-shadow(0 6px 6px rgba(0,0,0,.2));}

  .castle-far{position:absolute;right:5%;bottom:40%;width:150px;opacity:.9;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.15));}

  /* ---- narration bar ---- */
  .narr{display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:linear-gradient(#fff7e6,#f3e3c0);border-top:3px solid var(--card-edge);}
  .speaker{flex:none;width:52px;height:52px;border-radius:50%;border:none;
    background:radial-gradient(circle at 35% 30%,#ffd97a,var(--gold-deep));
    color:#fff;font-size:24px;cursor:pointer;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .speaker:active{transform:scale(.9);}
  .speaker.playing{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,164,53,.5)}50%{box-shadow:0 0 0 12px rgba(216,164,53,0)}}
  .prompt{font-family:var(--display);font-size:clamp(15px,2.6vw,20px);color:var(--ink-soft);line-height:1.25;}

  /* ---- choices ---- */
  .choices{display:flex;gap:18px;padding:14px 18px 18px;justify-content:center;}
  .card{flex:1;max-width:230px;border:none;cursor:pointer;
    background:var(--card);border-radius:20px;padding:12px 12px 10px;
    box-shadow:var(--shadow);border:3px solid var(--card-edge);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .18s;}
  .card:hover{transform:translateY(-4px);}
  .card .art{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;
    background:linear-gradient(#fffdf6,#f0e4c8);display:flex;align-items:center;justify-content:center;}
  .card .art svg,.card .art img{width:78%;height:78%;object-fit:contain;}
  .card .name{font-family:var(--display);font-size:clamp(16px,3vw,22px);
    font-weight:600;color:var(--ink);}
  .card.wiggle{animation:wiggle .5s;}
  @keyframes wiggle{0%,100%{transform:none}20%{transform:rotate(-4deg) translateX(-5px)}
    40%{transform:rotate(4deg) translateX(5px)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
  .card.chosen{animation:pop .45s;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

  /* ---- big buttons (start / win) ---- */
  .centerbox{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding-bottom:84px;gap:14px;}
  .title{font-family:var(--display);text-align:center;color:#fff;
    text-shadow:0 3px 0 var(--gold-deep),0 6px 10px rgba(0,0,0,.3);
    font-size:clamp(22px,5vw,38px);line-height:1.1;margin:0 18px;}
  .bigbtn{font-family:var(--display);font-size:clamp(18px,3.4vw,24px);font-weight:700;
    color:#fff;border:none;cursor:pointer;padding:14px 34px;border-radius:40px;
    background:linear-gradient(var(--forest),#23533d);box-shadow:var(--shadow);
    border:3px solid rgba(255,255,255,.5);transition:transform .15s;}
  .bigbtn:active{transform:scale(.94);}
  .bigbtn.gold{background:linear-gradient(var(--gold),var(--gold-deep));}
  .bigbtn.rose{background:linear-gradient(#cf5448,var(--rose));}
  .winrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

  /* loader + overlay */
  #loader,#overlay{position:absolute;inset:0;z-index:20;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--parchment);text-align:center;padding:24px;}
  #overlay{background:rgba(36,48,66,.86);color:#fff;}
  .bar{width:60%;max-width:280px;height:14px;border-radius:8px;background:#e0cfa6;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:width .25s;}
  .hidden{display:none!important;}
  .confetti{position:absolute;width:10px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(640px) rotate(540deg);opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <div id="loader">
    <div style="font-family:var(--display);font-size:26px;color:var(--ink)">Юнакът Радко</div>
    <div class="bar"><i id="barfill"></i></div>
    <div style="color:var(--ink-soft)">Зарежда приказката…</div>

/* ================================================================
   4. AUDIO ENGINE  —  synth chimes always; narration via TTS in
   placeholder mode or via your <audio> files in real mode.
   First playback is unlocked by the start-button tap (gesture).
   ================================================================ */
let actx=null, currentAudio=null;
function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
function tone(freq,dur,when,type,vol){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  o.connect(g); g.connect(c.destination);
  const t=c.currentTime+(when||0);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||.18,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t); o.stop(t+dur+.05);
}
function chimeOk(){ tone(660,.18,0,"sine",.2); tone(880,.28,.12,"sine",.2); }
function chimeNudge(){ tone(300,.22,0,"triangle",.14); }

function stopNarration(){
  if(currentAudio){ try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){}
    currentAudio.onended=currentAudio.onerror=null; currentAudio=null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function speak(text,onend){
  if(!("speechSynthesis" in window)){ onend&&setTimeout(onend,1400); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="bg-BG"; u.rate=.95; u.pitch=1.05;
  const v=speechSynthesis.getVoices().find(v=>/bg/i.test(v.lang));
  if(v) u.voice=v;
  if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}

// preloaded <audio> elements keyed by scene id (files mode) so playback
// is instant and survives replays / "Пак".
const audioCache={};
function buildAudioCache(){
  if(AUDIO_SOURCE!=="files") return;
  for(const id in NAR){
    const a=new Audio(); a.preload="auto"; a.src=AUDIO_BASE+NAR[id];
    audioCache[id]=a;
  }
  const land=new Audio(); land.preload="auto"; land.src=AUDIO_BASE+LANDING_AUDIO;
  audioCache.landing=land;
}
function clipSrc(key){ return key==="landing"?AUDIO_BASE+LANDING_AUDIO:AUDIO_BASE+NAR[key]; }

function playNarration(scene){
  stopNarration();
  setSpeaker(true);
  const done=()=>setSpeaker(false);
  if(AUDIO_SOURCE==="tts"){ speak(SCRIPT[scene.id]||"", done); return; }
  const a=audioCache[scene.id]||new Audio(clipSrc(scene.id));
  currentAudio=a; a.onended=done; a.onerror=done;
  try{ a.currentTime=0; }catch(e){}
  const p=a.play(); if(p&&p.catch) p.catch(done);
}
// play a list of clips back-to-back (used on the start screen: landing -> s1)
function playSequence(keys,texts){
  stopNarration();
  setSpeaker(true);
  let i=0;
  const step=()=>{
    if(i>=keys.length){ setSpeaker(false); return; }
    const key=keys[i], txt=texts?texts[i]:""; i++;
    if(AUDIO_SOURCE==="tts"){ speak(txt,step); return; }
    const a=audioCache[key]||new Audio(clipSrc(key));
    currentAudio=a; a.onended=step; a.onerror=step;
    try{ a.currentTime=0; }catch(e){}
    const p=a.play(); if(p&&p.catch) p.catch(step);
  };
  step();
}
function playStartSeq(){ playSequence(["landing","s1"],[SCRIPT.landing,SCRIPT.s1]); }
function setSpeaker(on){
  document.querySelectorAll(".speaker").forEach(b=>b.classList.toggle("playing",on));
}

/* ================================================================
   5. RENDER + STATE MACHINE
   ================================================================ */
const app=document.getElementById("app");
let current=null;

function artHTML(key){
  if(ART_SOURCE==="svg") return ICON[key]||`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#ccc"/></svg>`;
  return `<img src="${IMAGE_BASE+IMG[key]}" alt="">`;
}
function heroHTML(){ return ART_SOURCE==="svg"?ICON.radko:`<img src="${IMAGE_BASE+IMG.radko}" alt="">`; }
function castleHTML(){ return ART_SOURCE==="svg"?ICON.castle:`<img src="${IMAGE_BASE+IMG.castle}" alt="">`; }

function pathStrip(step){
  let dots="";
  for(let i=1;i<=6;i++) dots+=`<div class="foot ${i<=step?"done":""}"></div>`;
  return `<div class="pathstrip">${dots}</div>`;
}

function sceneryHTML(s){
  const key=(s.bg||"").replace("bg-","");
  return `<div class="scenery">${BG[key]||""}</div>`;
}

function buildScene(s){
  const el=document.createElement("div");
  el.className="scene "+s.bg; el.dataset.id=s.id;

  if(s.type==="start"){
    el.innerHTML=`
      <div class="stage">
        ${sceneryHTML(s)}
        <div class="hero" style="left:14%">${heroHTML()}</div>
        <div class="centerbox">
          <h1 class="title">${s.title.replace(/\n/g,"<br>")}</h1>
          <button class="speaker" data-listen aria-label="Чуй приказката">&#128266;</button>
          <button class="bigbtn" data-start>${s.startLabel}</button>
        </div>
      </div>`;
    el.querySelector("[data-listen]").onclick=()=>{ ac()&&ac().resume&&ac().resume(); playStartSeq(); };
    el.querySelector("[data-start]").onclick=()=>{ stopNarration(); ac()&&ac().resume&&ac().resume(); go(s.next); };
  }

  else if(s.type==="choice"){
    el.innerHTML=`
      <div class="stage">
        ${sceneryHTML(s)}
        ${pathStrip(s.step)}
        <div class="hero" style="left:${10+(s.step-1)*13}%">${heroHTML()}</div>
      </div>
      <div class="narr">
        <button class="speaker" data-replay aria-label="Чуй пак">&#128266;</button>
        <div class="prompt">${s.prompt||""}</div>
      </div>
      <div class="choices"></div>`;
    const wrap=el.querySelector(".choices");
    // randomize which side the correct card lands on, so the child
    // can't pattern-match position instead of the Р sound
    const order = Math.random()<0.5 ? s.choices : [s.choices[1],s.choices[0]];
    order.forEach(ch=>{
      const b=document.createElement("button");
      b.className="card"; b.setAttribute("aria-label",ch.label);
      b.innerHTML=`<div class="art">${artHTML(ch.key)}</div><div class="name">${ch.label}</div>`;
      b.onclick=()=>onChoice(ch,b,s);
      wrap.appendChild(b);
    });
    el.querySelector("[data-replay]").onclick=()=>playNarration(s);
  }

  else if(s.type==="win"){
    el.innerHTML=`
      <div class="stage">
        ${sceneryHTML(s)}
        ${pathStrip(6)}
        <div class="hero" style="left:44%">${heroHTML()}</div>
        <div class="centerbox">
          <h1 class="title">${s.title.replace(/\n/g,"<br>")}</h1>
          <div class="winrow">
            ${s.actions.map(a=>`<button class="bigbtn ${a.cls||""}" data-goto="${a.goto}">${a.label}</button>`).join("")}
          </div>
        </div>
      </div>`;
    el.querySelectorAll("[data-goto]").forEach(b=>{
      b.onclick=()=>{ const t=b.dataset.goto; t==="level2"?showLevel2():go(t); };
    });
  }
  return el;
}

function onChoice(ch,btn,scene){
  if(ch.correct){
    btn.classList.add("chosen"); chimeOk();
    document.querySelectorAll(".card").forEach(c=>c.disabled=true);
    setTimeout(()=>go(ch.next),650);   // next scene's narration plays the "Браво!"
  }else{
    btn.classList.remove("wiggle"); void btn.offsetWidth; // restart animation
    btn.classList.add("wiggle"); chimeNudge();
    setTimeout(()=>playNarration(scene),550); // gentle re-listen, no penalty
  }
}

function sceneById(id){ return SCENES.find(s=>s.id===id); }

function go(id){
  const s=sceneById(id); if(!s) return;
  stopNarration();
  const old=app.querySelector(".scene.active");
  const next=buildScene(s);
  app.appendChild(next);
  requestAnimationFrame(()=>{
    next.classList.add("active");
    if(old){ old.classList.remove("active"); setTimeout(()=>old.remove(),500); }
  });
  current=s;
  if(s.type==="start"){
    // best-effort autoplay of landing -> opening narration; if the browser
    // blocks it (no gesture yet) the 🔊 button plays it on first tap
    setTimeout(()=>playStartSeq(),320);
  }else{
    if(s.type==="win") burstConfetti();
    setTimeout(()=>playNarration(s),420);
  }
}

/* ---- overlays ---- */
function showLevel2(){
  const o=document.createElement("div"); o.id="overlay";
  o.innerHTML=`<div style="font-family:var(--display);font-size:30px">Ниво 2</div>
    <div style="font-size:20px">Очаквай скоро! &#11088;</div>
    <button class="bigbtn gold" id="back2">Назад</button>`;
  app.appendChild(o);
  o.querySelector("#back2").onclick=()=>{ o.remove(); };
}
function burstConfetti(){
  const colors=["#d8a435","#b23a2e","#2f6b4f","#3b7ea1","#fff7e6"];
  for(let i=0;i<28;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=Math.random()*100+"%";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*1.5)+"s";
    c.style.animationDelay=(Math.random()*.6)+"s";
    app.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}

/* ================================================================
   6. PRELOAD + BOOT
   ================================================================ */
function preload(cb){
  const bar=document.getElementById("barfill");
  buildAudioCache();   // start buffering hosted audio now (non-blocking; MP3 streams on play)
  // Audio doesn't gate startup — only images do, and only in image mode.
  const imgs = ART_SOURCE==="image" ? Object.values(IMG).map(f=>IMAGE_BASE+f) : [];
  if(imgs.length===0){ // SVG art: nothing to fetch, brief polish sweep
    let p=0; const t=setInterval(()=>{p+=25;bar.style.width=p+"%";if(p>=100){clearInterval(t);cb();}},70);
    return;
  }
  let done=0, finished=false; const total=imgs.length;
  const finish=()=>{ if(!finished){ finished=true; clearTimeout(guard); cb(); } };
  const tick=()=>{ done++; bar.style.width=Math.round(done/total*100)+"%"; if(done>=total) finish(); };
  const guard=setTimeout(finish,8000); // never hang the loader
  imgs.forEach(u=>{ const im=new Image(); im.onload=im.onerror=tick; im.src=u; });
}

window.addEventListener("load",()=>{
  if(window.speechSynthesis) speechSynthesis.getVoices(); // warm up voices
  preload(()=>{
    document.getElementById("loader").classList.add("hidden");
    go("s1");
  });
});
</script>
